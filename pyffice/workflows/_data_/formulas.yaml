<(META)>:
  <(WT)>: -32
  authority: document|this
  description: ''
  docid: <^[uuid]^>
  expirary: <[expiration]>
  formula: ''
  name: ''
  outline: <[outline]>
  path: <[LEXIvrs]>
  security: sec|lvl2
  version: <[version]>
PyfficeFormula:

Formulas:
  ABS:
    description: '''Returns the absolute value of a number'''
    name: Absolute Value
    formula: "=ABS(<[cr0]>)"
    tags:
    - Math
    - Trigonometry
  ACCRINT:
    description: Accrued Interest 'Returns the accrued interest for a security that
      pays periodic interest'
    name: Accrued Interest Periodic
    formula: "=ACCRINT(<[issue]>, <[first_interest]>, <[settlement]>, <[rate]>, <[par]>, <[frequency]>, <~[basis]~>, <~[calc_method]~>)"
    tags:
    - Financial
  ACCRINTM:
    description: '''Returns the accrued interest for a security that pays interest at
      maturity'''
    name: Accrued Interest at Maturity
    formula: "=ACCRINTM(<[issue]>, <[settlement]>, <[rate]>, <[par]>,<~[basis]~>)"
    tags:
    - Financial
  ACOS:
    description: '''Returns the arccosine of a number'''
    name: Arccosine
    formula: "=ACOS()"
    tags:
    - Math
    - Trigonometry
  ACOSH:
    description: Returns the inverse hyperbolic cosine of a number
    name: Inverse Hyperbolic Cosine
    formula: =ACOSH()
    tags:
    - Math
    - Trigonometry
  ACOT:
    description: '''Returns the arccotangent of a number'''
    name: Arccotangent
    formula: =ACOT()
    tags:
    - Excel 2013
    - Math
    - Trigonometry
  ACOTH:
    description: Returns the hyperbolic arccotangent of a number
    name: Hyperbolic Arccotangent
    formula: =ACOTH()
    tags:
    - Excel 2013
    - Math
    - Trigonometry
  ADDRESS:
    description: Returns a reference as text to a single cell in a worksheet
    name: Cell Reference as Text
    formula: "=ADDRESS(<[row]>, <[column]>, <~[abs_num]~>, <~[a1]~>, <~[sheet_text]~>)"
    tags:
    - Lookup
    - Reference
  AGGREGATE:
    description: '''Returns an aggregate in a list or database'''
    name: Aggregate
    formula: =AGGREGATE()
    tags:
    - Math
    - Trigonometry
  AMORDEGRC:
    description: Returns the depreciation for each accounting period by using a depreciation
      coefficient
    name: Depreciation by Coefficient
    formula: "=AMORDEGRC(<[cost]>, <[date_purchased]>, <[first_period]>, <[salvage]>, <[period]>, <[rate]>, <~[basis]~>)"
    tags:
    - Financial'
  AMORLINC:
    description: Returns the depreciation for each accounting period
    name: Depreciation per Period
    formula: "=AMORLINC(<[cost]>, <[date_purchased]>, <[first_period]>, <[salvage]>, <[period]>, <[rate]>, <~[basis]~>)"
    tags:
    - Financial
  AND:
    description: Returns TRUE if all of its arguments are TRUE
    name: Logical AND
    formula: "=AND(<[logical1]>, <~[logical2]~>)"
    tags:
    - Logical
  ARABIC:
    description: Converts a Roman number to Arabic', 'as a number
    name: Arabic Numeral
    formula: "=ARABIC(<[text]>)"
    tags:
    - Excel 2013 Math
    - trigonometry
  AREAS:
    description: Returns the number of areas in a reference
    name: Number of Areas in Reference
    formula: "=AREAS(<[reference]>)"
    tags:
    - Lookup
    - reference
  ASC:
    description: Changes full-width (double-byte) English letters or katakana within
      a character string to half-width (single-byte) characters
    name: Full-width to Half-width
    formula: "=ASC(<[text]>)"
    tags:
    - Text
  ASIN:
    description: Returns the arcsine of a number
    name: Arcsine
    formula: "=ASIN(<[number]>)"
    tags:
    - Math
    - trigonometry
  ASINH:
    description: Returns the inverse hyperbolic sine of a number
    name: Inverse Hyperbolic Sine
    formula: "=ASINH(<[number]>)"
    tags:
    - Math
    - trigonometry
  ATAN:
    description: Returns the arctangent of a number
    name: Arctangent
    formula: "=ATAN(<[number]>)"
    tags:
    - Math
    - trigonometry
  ATAN2:
    description: Returns the arctangent from x-', 'y-coordinates
    name: Arctangent from x,y
    formula: "=ATAN2(<[x_num]>, <[y_num]>)"
    tags:
    - Math
    - trigonometry
  ATANH:
    description: Returns the inverse hyperbolic tangent of a number
    name: Inverse Hyperbolic Tangent
    formula: "=ATANH(<[number]>)"
    tags:
    - Math
    - trigonometry
  AVEDEV:
    description: Returns the average of the absolute deviations of data points from
      their mean
    name: Average Absolute Deviation
    formula: "=AVEDEV(<[number1]>, <~[number2]~>)"
    tags:
    - Statistical
  AVERAGE:
    description: Returns the average of its arguments
    name: Average
    formula: "=AVERAGE(<[number1]>, <~[number2]~>)"
    tags:
    - Statistical
  AVERAGEA:
    description: Returns the average of its arguments', 'including numbers', 'text,',
      'logical values
    name: Average Including Text/Logical
    formula: "=AVERAGEA(<[value1]>, <~[value2]~>)"
    tags:
    - '[Statistical'
  AVERAGEIF:
    description: Returns the average (arithmetic mean) of all the cells in a range that
      meet a given criteria
    name: Average If
    formula: "=AVERAGEIF(<[range]>, <[criteria]>, <~[average_range]~>)"
    tags:
    - Statistical
  AVERAGEIFS:
    description: Returns the average (arithmetic mean) of all cells that meet multiple
      criteria.
    name: Average Ifs
    formula: "=AVERAGEIFS(<[average_range]>, <[criteria_range1]>, <[criteria1]>, <~[criteria_range2]~>, <~[criteria2]~>)"
    tags:
    - Statistical
  BAHTTEXT:
    description: "Converts a number to text', 'using the \xDF (baht) currency format"
    name: Number to Baht Text
    formula: "=BAHTTEXT(<[number]>)"
    tags:
    - Text
  BASE:
    description: '''Converts a number into a text representation with the given radix
      (base)'''
    name: Base Conversion
    formula: "=BASE(<[number]>, <[radix]>, <~[min_length]~>)"
    tags:
    - Math
    - trigonometry
  BESSELI:
    description: Returns the modified Bessel  In(x)
    name: Modified Bessel In(x)
    formula: "=BESSELI(<[x]>, <[n]>)"
    tags:
    - Engineering
  BESSELJ:
    description: '''Returns the Bessel  Jn(x)'''
    name: Bessel Jn(x)
    formula: "=BESSELJ(<[x]>, <[n]>)"
    tags:
    - Engineering
  BESSELK:
    description: '''Returns the modified Bessel  Kn(x)'''
    name: Modified Bessel Kn(x)
    formula: "=BESSELK(<[x]>, <[n]>)"
    tags:
    - Engineering
  BESSELY:
    description: '''Returns the Bessel  Yn(x)'''
    name: Bessel Yn(x)
    formula: "=BESSELY(<[x]>, <[n]>)"
    tags:
    - Engineering
  BETA.DIST:
    description: '''Returns the beta cumulative distribution'''
    name: Beta Cumulative Distribution
    formula: "=BETA.DIST(<[x]>, <[alpha]>, <[beta]>, <[cumulative]>, <~[A]~>, <~[B]~>)"
    tags:
    - Excel 2010
    - Statistical
  BETA.INV:
    description: '''Returns the inverse of the cumulative distribution'' ''for a specified
      beta distribution'''
    name: Inverse Beta Distribution
    formula: "=BETA.INV(<[probability]>, <[alpha]>, <[beta]>, <~[A]~>, <~[B]~>)"
    tags:
    - Excel 2010
    - Statistical
  BETADIST:
    description: '''Returns the beta cumulative distribution'''
    name: Beta Cumulative Distribution (legacy)
    formula: "=BETADIST(<[x]>, <[alpha]>, <[beta]>, <~[A]~>, <~[B]~>)"
    tags:
    - Compatibility
    - Excel 2007
    - Statistical
  BETAINV:
    description: '''Returns the inverse of the cumulative distribution'' ''for a specified
      beta distribution'''
    name: Inverse Beta Distribution (legacy)
    formula: "=BETAINV(<[probability]>, <[alpha]>, <[beta]>, <~[A]~>, <~[B]~>)"
    tags:
    - Compatibility
    - Excel 2007
    - Statistical
  BIN2DEC:
    description: Converts a binary number to decimal
    name: Binary to Decimal
    formula: "=BIN2DEC(<[number]>)"
    tags:
    - '[Engineering'
  BIN2HEX:
    description: Converts a binary number to hexadecimal
    name: Binary to Hexadecimal
    formula: "=BIN2HEX(<[number]>, <~[places]~>)"
    tags:
    - '[Engineering'
  BIN2OCT:
    description: Converts a binary number to octal
    name: Binary to Octal
    formula: "=BIN2OCT(<[number]>, <~[places]~>)"
    tags:
    - '[Engineering'
  BINOM.DIST:
    description: Returns the individual term binomial distribution probability
    name: Binomial Distribution Probability
    formula: "=BINOM.DIST(<[number_s]>, <[trials]>, <[probability_s]>, <[cumulative]>)"
    tags:
    - '[Excel 2010 Statistical'
  BINOM.DIST.RANGE:
    description: Returns the probability of a trial result using a binomial distribution
    name: Binomial Distribution Range
    formula: "=BINOM.DIST.RANGE(<[trials]>, <[probability_s]>, <[number_s]>, <~[number_s2]~>)"
    tags:
    - '[Excel 2013Statistical'
  BINOM.INV:
    description: Returns the smallest value for which the cumulative binomial distribution
      is less than or equal to a criterion value
    name: Binomial Inverse
    formula: "=BINOM.INV(<[trials]>, <[probability_s]>, <[alpha]>)"
    tags:
    - '[Excel 2010Statistical'
  BINOMDIST:
    description: Returns the individual term binomial distribution probability In Excel
      2007', 'this is a Statistical .
    name: Binomial Distribution (legacy)
    formula: "=BINOMDIST(<[number_s]>, <[trials]>, <[probability_s]>, <[cumulative]>)"
    tags:
    - '[Compatibility'
  BITAND:
    description: Returns a 'Bitwise And' of two numbers
    name: Bitwise AND
    formula: "=BITAND(<[number1]>, <[number2]>)"
    tags:
    - Excel 2013 Engineering
  BITLSHIFT:
    description: Returns a value number shifted left by shift_amount bits
    name: Bitwise Left Shift
    formula: "=BITLSHIFT(<[number]>, <[shift_amount]>)"
    tags:
    - Excel 2013 Engineering
  BITOR:
    description: Returns a bitwise OR of 2 numbers
    name: Bitwise OR
    formula: "=BITOR(<[number1]>, <[number2]>)"
    tags:
    - Excel 2013 Engineering
  BITRSHIFT:
    description: Returns a value number shifted right by shift_amount bits
    name: Bitwise Right Shift
    formula: "=BITRSHIFT(<[number]>, <[shift_amount]>)"
    tags:
    - Excel 2013 Engineering
  BITXOR:
    description: Returns a bitwise 'Exclusive Or' of two numbers
    name: Bitwise XOR
    formula: "=BITXOR(<[number1]>, <[number2]>)"
    tags:
    - Excel 2013 Engineering
  CALL:
    description: Calls a procedure in a dynamic link library or code resource
    name: Call DLL Procedure
    formula: "=CALL(<[register_id]>, <~[argument1]~>, <~[argument2]~>)"
    tags:
    - Add-in
    - Automation
  CEILING:
    description: Rounds a number to the nearest integer or to the nearest multiple of
      significance
    name: Ceiling
    formula: "=CEILING(<[number]>, <[significance]>)"
    tags:
    - Math
    - trigonometry
  CEILING.MATH:
    description: Rounds a number up', 'to the nearest integer or to the nearest multiple
      of significance
    name: Ceiling Math
    formula: "=CEILING.MATH(<[number]>, <~[significance]~>, <~[mode]~>)"
    tags:
    - Excel 2013 Math
    - trigonometry
  CEILING.PRECISE:
    description: Rounds a number the nearest integer or to the nearest multiple of significance.
      Regardless of the sign of the number, the number is rounded up.
    name: Ceiling Precise
    formula: "=CEILING.PRECISE(<[number]>, <~[significance]~>)"
    tags:
    - '[Math'
    - trigonometry
  CELL:
    description: Returns information about the formatting', 'location', 'or contents
      of a cell not Excel Online.
    name: Cell Information
    formula: "=CELL(<[info_type]>, <~[reference]~>)"
    tags:
    - Information
  CHAR:
    description: Returns the character specified by the code number
    name: Character from Code
    formula: "=CHAR(<[number]>)"
    tags:
    - Text
  CHIDIST:
    description: 'Returns the one-tailed probability of the chi-squared distribution
      Note'': In Excel 2007'', ''this is a Statistical .'
    name: Chi-squared One-tailed (legacy)
    formula: "=CHIDIST(<[x]>, <[deg_freedom]>)"
    tags:
    - Compatibility
  CHIINV:
    description: 'Returns the inverse of the one-tailed probability of the chi-squared
      distribution Note'': In Excel 2007'', ''this is a Statistical .'
    name: Inverse Chi-squared (legacy)
    formula: "=CHIINV(<[probability]>, <[deg_freedom]>)"
    tags:
    - Compatibility
  CHISQ.DIST:
    description: Returns the cumulative beta probability density
    name: Chi-squared Distribution
    formula: "=CHISQ.DIST(<[x]>, <[deg_freedom]>, <[cumulative]>)"
    tags:
    - Excel 2010  Statistical
  CHISQ.DIST.RT:
    description: Returns the one-tailed probability of the chi-squared distribution
    name: Chi-squared One-tailed
    formula: "=CHISQ.DIST.RT(<[x]>, <[deg_freedom]>)"
    tags:
    - Excel 2010 Statistical
  CHISQ.INV:
    description: Returns the cumulative beta probability density
    name: Chi-squared Distribution Inverse
    formula: "=CHISQ.INV(<[probability]>, <[deg_freedom]>)"
    tags:
    - Excel 2010 Statistical
  CHISQ.INV.RT:
    description: Returns the inverse of the one-tailed probability of the chi-squared
      distribution
    name: Inverse Chi-squared One-tailed
    formula: "=CHISQ.INV.RT(<[probability]>, <[deg_freedom]>)"
    tags:
    - Excel 2010
    - Statistical
  CHISQ.TEST:
    description: Returns the test for independence
    name: Chi-squared Independence Test
    formula: "=CHISQ.TEST(<[actual_range]>, <[expected_range]>)"
    tags:
    - Excel 2010 Statistical
  CHITEST:
    description: 'Returns the test for independence Note'': In Excel 2007'', ''this
      is a Statistical .'
    name: Chi-squared Independence Test (legacy)
    formula: "=CHITEST(<[actual_range]>, <[expected_range]>)"
    tags:
    - Compatibility
  CHOOSE:
    description: Chooses a value from a list of values
    name: Choose Value from List
    formula: "=CHOOSE(<[index_num]>, <[value1]>, <~[value2]~>)"
    tags:
    - Lookup
    - reference
  CLEAN:
    description: Removes all nonprintable characters from text
    name: Strip Nonprintable
    formula: "=CLEAN(<[text]>)"
    tags:
    - Text
  CODE:
    description: Returns a numeric code for the first character in a text string
    name: Numeric Code of First Char
    formula: "=CODE(<[text]>)"
    tags:
    - Text
  COLUMN:
    description: Returns the column number of a reference
    name: Column Number of Reference
    formula: "=COLUMN(<~[reference]~>)"
    tags:
    - Lookup
    - reference
  COLUMNS:
    description: Returns the number of columns in a reference
    name: Number of Columns
    formula: "=COLUMNS(<[array]>)"
    tags:
    - Lookup
    - reference
  COMBIN:
    description: Returns the number of combinations for a given number of objects
    name: Combinations
    formula: "=COMBIN(<[number]>, <[number_chosen]>)"
    tags:
    - Math
    - trigonometry
  COMBINA:
    description: Returns the number of combinations with repetitions for a given number
      of items
    name: Combinations with Repetitions
    formula: "=COMBINA(<[number]>, <[number_chosen]>)"
    tags:
    - Excel 2013 Math
    - trigonometry
  COMPLEX:
    description: Converts real', 'imaginary coefficients into a complex number
    name: Complex Number
    formula: "=COMPLEX(<[real_num]>, <[i_num]>, <~[suffix]~>)"
    tags:
    - Engineering
  CONCAT:
    description: Combines the text from multiple ranges and/or strings', 'but it doesn't
      provide the delimiter or IgnoreEmpty arguments.
    name: Concatenate Range
    formula: "=CONCAT(<[text1]>, <~[text2]~>)"
    tags:
    - Excel 2016'
    - Text
  CONCATENATE:
    description: Joins several text items into one text item
    name: Concatenate Strings
    formula: "=CONCATENATE(<[text1]>, <~[text2]~>)"
    tags:
    - Text
  CONFIDENCE:
    description: Returns the confidence interval for a population mean In Excel 2007',
      'this is a Statistical .
    name: Confidence Interval (legacy)
    formula: "=CONFIDENCE(<[alpha]>, <[standard_dev]>, <[size]>)"
    tags:
    - Compatibility
  CONFIDENCE.NORM:
    description: Returns the confidence interval for a population mean
    name: Confidence Interval Normal
    formula: "=CONFIDENCE.NORM(<[alpha]>, <[standard_dev]>, <[size]>)"
    tags:
    - Excel 2010'
    - Statistical
  CONFIDENCE.T:
    description: Returns the confidence interval for a population mean', 'using a Student's
      t distribution
    name: Confidence Interval Student t
    formula: "=CONFIDENCE.T(<[alpha]>, <[standard_dev]>, <[size]>)"
    tags:
    - Excel 2010
    - Statistical
  CONVERT:
    description: Converts a number from one measurement system to another
    name: Unit Conversion
    formula: "=CONVERT(<[number]>, <[from_unit]>, <[to_unit]>)"
    tags:
    - Engineering'
  CORREL:
    description: Returns the correlation coefficient between two data sets
    name: Correlation Coefficient
    formula: "=CORREL(<[array1]>, <[array2]>)"
    tags:
    - Statistical'
  COS:
    description: Returns the cosine of a number
    name: Cosine
    formula: "=COS(<[number]>)"
    tags:
    - Math'
    - trigonometry
  COSH:
    description: Returns the hyperbolic cosine of a number
    name: Hyperbolic Cosine
    formula: "=COSH(<[number]>)"
    tags:
    - Math'
    - trigonometry
  COT:
    description: Returns the hyperbolic cosine of a number
    name: Cotangent
    formula: "=COT(<[number]>)"
    tags:
    - Excel 2013
    - Math
    - trigonometry
  COTH:
    description: Returns the cotangent of an angle
    name: Hyperbolic Cotangent
    formula: "=COTH(<[number]>)"
    tags:
    - Excel 2013
    - Math
    - trigonometry
  COUNT:
    description: Counts how many numbers are in the list of arguments
    name: Count Numbers
    formula: "=COUNT(<[value1]>, <~[value2]~>)"
    tags:
    - Statistical
  COUNTA:
    description: Counts how many values are in the list of arguments
    name: Count Non-blank
    formula: "=COUNTA(<[value1]>, <~[value2]~>)"
    tags:
    - Statistical
  COUNTBLANK:
    description: Counts the number of blank cells within a range
    name: Count Blank
    formula: "=COUNTBLANK(<[range]>)"
    tags:
    - Statistical
  COUNTIF:
    description: Counts the number of cells within a range that meet the given criteria
    name: Count If
    formula: "=COUNTIF(<[range]>, <[criteria]>)"
    tags:
    - Statistical
  COUNTIFS:
    description: Counts the number of cells within a range that meet multiple criteria
    name: Count Ifs
    formula: "=COUNTIFS(<[criteria_range1]>, <[criteria1]>, <~[criteria_range2]~>, <~[criteria2]~>)"
    tags:
    - Statistical
  COUPDAYBS:
    description: Returns the number of days from the beginning of the coupon period
      to the settlement date
    name: Days from Coupon Start
    formula: "=COUPDAYBS(<[settlement]>, <[maturity]>, <[frequency]>, <~[basis]~>)"
    tags:
    - Financial
  COUPDAYS:
    description: Returns the number of days in the coupon period that contains the settlement
      date
    name: Days in Coupon Period
    formula: "=COUPDAYS(<[settlement]>, <[maturity]>, <[frequency]>, <~[basis]~>)"
    tags:
    - Financial
  COUPDAYSNC:
    description: Returns the number of days from the settlement date to the next coupon
      date
    name: Days to Next Coupon
    formula: "=COUPDAYSNC(<[settlement]>, <[maturity]>, <[frequency]>, <~[basis]~>)"
    tags:
    - Financial
  COUPNCD:
    description: Returns the next coupon date after the settlement date
    name: Next Coupon Date
    formula: "=COUPNCD(<[settlement]>, <[maturity]>, <[frequency]>, <~[basis]~>)"
    tags:
    - Financial
  COUPNUM:
    description: Returns the number of coupons payable between the settlement date',
      'maturity date
    name: Number of Coupons Payable
    formula: "=COUPNUM(<[settlement]>, <[maturity]>, <[frequency]>, <~[basis]~>)"
    tags:
    - Financial
  COUPPCD:
    description: Returns the previous coupon date before the settlement date
    name: Previous Coupon Date
    formula: "=COUPPCD(<[settlement]>, <[maturity]>, <[frequency]>, <~[basis]~>)"
    tags:
    - Financial
  COVAR:
    description: Returns covariance', 'the average of the products of paired deviations
      In Excel 2007', 'this is a Statistical .
    name: Covariance (legacy)
    formula: "=COVAR(<[array1]>, <[array2]>)"
    tags:
    - Compatibility
  COVARIANCE.P:
    description: Returns covariance', 'the average of the products of paired deviations
    name: Covariance Population
    formula: "=COVARIANCE.P(<[array1]>, <[array2]>)"
    tags:
    - Excel 2010
    - Statistical
  COVARIANCE.S:
    description: Returns the sample covariance', 'the average of the products deviations
      for each data point pair in two data sets
    name: Covariance Sample
    formula: "=COVARIANCE.S(<[array1]>, <[array2]>)"
    tags:
    - Excel 2010
    - Statistical
  CRITBINOM:
    description: Returns the smallest value for which the cumulative binomial distribution
      is less than or equal to a criterion value In Excel 2007', 'this is a Statistical
      .
    name: Critical Binomial (legacy)
    formula: "=CRITBINOM(<[trials]>, <[probability_s]>, <[alpha]>)"
    tags:
    - Compatibility
  CSC:
    description: Returns the cosecant of an angle
    name: Cosecant
    formula: "=CSC(<[number]>)"
    tags:
    - Excel 2013
    - Math
    - trigonometry
  CSCH:
    description: Returns the hyperbolic cosecant of an angle
    name: Hyperbolic Cosecant
    formula: "=CSCH(<[number]>)"
    tags:
    - Excel 2013
    - Math
    - trigonometry
  CUBEKPIMEMBER:
    description: Returns a key performance indicator (KPI) name', 'property,', 'measure,',
      'displays the name', 'property in the cell. A KPI is a quantifiable measurement',
      'such as monthly gross profit or quarterly employee turnover', 'used to monitor
      an organization's performance.
    name: Cube KPI Member
    formula: "=CUBEKPIMEMBER(<[connection]>, <[kpi_name]>, <[kpi_property]>, <[caption]>)"
    tags:
    - Cube
  CUBEMEMBER:
    description: Returns a member or tuple in a cube hierarchy. Use to validate that
      the member or tuple exists in the cube.
    name: Cube Member
    formula: "=CUBEMEMBER(<[connection]>, <[member_expression]>, <~[caption]~>)"
    tags:
    - Cube
  CUBEMEMBERPROPERTY:
    description: Returns the value of a member property in the cube. Use to validate
      that a member name exists within the cube', 'to return the specified property
      for this member.
    name: Cube Member Property
    formula: "=CUBEMEMBERPROPERTY(<[connection]>, <[member_expression]>, <[property]>)"
    tags:
    - Cube
  CUBERANKEDMEMBER:
    description: Returns the nth', 'or ranked', 'member in a set. Use to return one
      or more elements in a set', 'such as the top sales performer or top 10 students.
    name: Cube Ranked Member
    formula: "=CUBERANKEDMEMBER(<[connection]>, <[set_expression]>, <[rank]>, <~[caption]~>)"
    tags:
    - Cube
  CUBESET:
    description: '''Defines a calculated set of members or tuples by sending a set expression
      to the cube on the server'', ''which creates the set,'', ''then returns that set
      to Microsoft Office Excel.'
    name: Cube Set
    formula: "=CUBESET(<[connection]>, <[set_expression]>, <~[caption]~>, <~[sort_order]~>, <~[sort_by]~>)"
    tags:
    - Cube
  CUBESETCOUNT:
    description: Returns the number of items in a set.
    name: Cube Set Count
    formula: "=CUBESETCOUNT(<[set]>)"
    tags:
    - Cube
  CUBEVALUE:
