        hash:
        metadata:
          author:
          editors:
          document_type:
          creon_dttm:
          modon_dttm:
        data:
            datetime:
            tags: ""
            input:
                structured:
                  context:
                      data:
                        text:
                            did:
                            unit:
                                value:
                        metrics:
                          accuracy:
                          relevance:
                          length:
                      document:
                        text:
                            did:
                            unit:
                                value:
                        metrics:
                          accuracy:
                          relevance:
                          length:
                      application:
                        text:
                            did:
