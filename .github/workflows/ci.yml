name: CI

on:
  push:
    branches: [main, gamma, orin-ws]
  pull_request:
    branches: [main, gamma]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pytest ruff pyright bandit
    
    - name: Run tests
      run: pytest tests/
    
    - name: Check with ruff
      run: ruff check .
    
    - name: Type check with pyright
      run: pyright .
    
    - name: Security scan with bandit
      run: bandit -r pyffice/ -x tests/
