[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyffice"
version = "0.1.0"
description = "Unified Python interface for document processing, CAD, media, and office automation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pyffice Team"}
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "bandit"]

[tool.setuptools]
packages = ["pyffice"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
