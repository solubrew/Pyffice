[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "bandit"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["pyffice", "pyffice.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--continue-on-collection-errors"
# T-NEW-058: enable collection of *TEST.py files (matches the
# naming convention used by the new unit tests in
# tests/pyffice_unit/unit/<subpkg>/<subpkg>TEST.py). The default
# test_*.py pattern would skip them.
python_files = ["test_*.py", "*TEST.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
