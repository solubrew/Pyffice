[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyffice"
version = "0.1.0"
description = "Unified Python interface for document processing, CAD, media, and office automation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pyffice Team"}
]
requires-python = ">=3.10"
dependencies = [
    'pycel',
    # Core
    "backoff",
    "click",
    "pyyaml",
    "ruamel.yaml",
    "nbformat",

     #Document formats
    "openpyxl",
    "python-docx",
    "python-pptx",
    "PyPDF2",
    "PyMuPDF",
    "nbformat",

     #Data & visualization
    #"networkx==2.7",
    "plotly",
    "pydot",
    "matplotlib",
    "seaborn",
    "graphviz",
    "colormath",
    "cairosvg",
    #"pycel",
    "solidpython",

    # Database
    "sqlalchemy",

    # Web & utilities
    #"twof",
    "furl",
    "bs4",
    "ffmpeg-python",
    "pydub",
    "schedule",

    # External services
    "ultimate-notion",
    "notion-client",

    # Hardware/IoT (optional)
    "pyserial",
    "adafruit-ampy",
    "esptool",

    # Special formats
    "floweaver",

    # Python 2 compatibility (legacy)
    'defusedxml; platform_system == "Windows"',
    'futures; python_version < "3"',
    'six; platform_system == "Linux" and python_version > "3.3"',
    'pypiwin32; platform_system == "Windows"',
    'wheel<=0.29.0; python_version < "2.7"',
]
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "bandit"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["pyffice", "pyffice.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
